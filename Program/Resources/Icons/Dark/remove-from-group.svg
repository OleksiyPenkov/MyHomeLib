<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475E74"/>
      <stop offset="100%" stop-color="#2E4256"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Star and badge geometry is deliberately identical to add-to-favorites: the
       same toolbar button swaps between the two, so any offset reads as a jump. -->
  <g filter="url(#shadow)" stroke="#9AACBB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="17,6 19.94,13.96 28.41,14.29 21.76,19.55 24.05,27.71 17,23 9.95,27.71 12.24,19.55 5.59,14.29 14.06,13.96" fill="url(#body)"/>
    <circle cx="24" cy="24" r="5" fill="#E05555" stroke="#9AACBB" stroke-width="1.2"/>
    <line x1="21.75" y1="24" x2="26.25" y2="24" stroke="#1a2a3a" stroke-width="1.6"/>
  </g>
</svg>
