<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E6F2"/>
      <stop offset="100%" stop-color="#B4C8DC"/>
    </linearGradient>
    <linearGradient id="sec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0D0E2"/>
      <stop offset="100%" stop-color="#96AABE"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#0a1a2e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Tree counterpart of tree-table-mode: same panel, header and accent, so the
       button reads as one control switching state rather than two icons. -->
  <g filter="url(#shadow)" stroke="#19375F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="7" width="28" height="26" rx="3" fill="url(#body)"/>
    <rect x="6" y="7" width="28" height="7" rx="3" fill="url(#sec)"/>
    <line x1="6" y1="14" x2="34" y2="14"/>
    <line x1="8" y1="10.5" x2="14" y2="10.5" stroke="#3CB4DC" stroke-width="1.5"/>

    <!-- Parent node: expander box + label -->
    <rect x="9" y="17.5" width="4.5" height="4.5" rx="1" fill="url(#sec)" stroke-width="1.2"/>
    <line x1="10.3" y1="19.75" x2="12.2" y2="19.75" stroke-width="1.2"/>
    <line x1="16" y1="19.75" x2="30" y2="19.75" stroke-width="1.5"/>

    <!-- Connectors down to the children -->
    <path d="M11.25 22 L11.25 29.5" stroke-width="1.2"/>
    <path d="M11.25 25.25 L15 25.25" stroke-width="1.2"/>
    <path d="M11.25 29.5 L15 29.5" stroke-width="1.2"/>

    <!-- Child labels -->
    <line x1="17" y1="25.25" x2="30" y2="25.25" stroke-width="1.5"/>
    <line x1="17" y1="29.5" x2="30" y2="29.5" stroke-width="1.5"/>
  </g>
</svg>
