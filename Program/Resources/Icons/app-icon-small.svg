<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- MyHomeLib application icon - simplified cut for 24px and below.
       The carcass is dropped: at 16px a frame plus five spines is ~2px per
       element and reads as grey mush. Four spines on a board still read. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFA268"/><stop offset="100%" stop-color="#A5764A"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CE6857"/><stop offset="100%" stop-color="#B85445"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6B455"/><stop offset="100%" stop-color="#D09A38"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FC2E8"/><stop offset="100%" stop-color="#33A6CF"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3E6BA8"/><stop offset="100%" stop-color="#2F5C96"/>
    </linearGradient>
  </defs>

  <g stroke="#19375F" stroke-width="15">
    <rect x="29" y="28"  width="44" height="176" rx="10" fill="url(#brick)"/>
    <rect x="80" y="56"  width="44" height="148" rx="10" fill="url(#amber)"/>
    <rect x="131" y="24" width="44" height="180" rx="10" fill="url(#cyan)"/>
    <rect x="182" y="48" width="44" height="156" rx="10" fill="url(#indigo)"/>
    <rect x="17" y="204" width="221" height="28" rx="10" fill="url(#wood)"/>
  </g>
</svg>
